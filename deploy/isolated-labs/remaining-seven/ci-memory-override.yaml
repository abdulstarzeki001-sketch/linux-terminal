# Disposable CI host only. This overrides per-service memory ceilings from
# the dedicated-VM compose, without changing network isolation or any ports.
# Do NOT use these reduced limits for sustained BloodHound CE workloads.
services:
  bh-postgres:
    mem_limit: 768m
  bh-neo4j:
    mem_limit: 2300m
    environment:
      NEO4J_dbms_memory_heap_initial__size: "256m"
      NEO4J_dbms_memory_heap_max__size: "1024m"
      NEO4J_dbms_memory_pagecache_size: "512m"
  bloodhound:
    mem_limit: 2600m
