name: STAR Isolated Lab Build and Security Checks

on:
  pull_request:
    paths:
      - "deploy/isolated-labs/**"
      - ".github/workflows/isolated-labs.yml"
  push:
    branches: [main]
    paths:
      - "deploy/isolated-labs/**"
      - ".github/workflows/isolated-labs.yml"
  workflow_dispatch:
    inputs:
      build_ghidra:
        description: "Explicitly build the large Ghidra image in a temporary runner"
        type: boolean
        default: false
        required: false

permissions:
  contents: read

jobs:
  manifest-and-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest and fail-closed offline Compose security
        run: |
          set -euo pipefail
          bash -n deploy/isolated-labs/scripts/preflight.sh
          bash -n deploy/isolated-labs/remaining-seven/preflight.sh
          docker compose -f deploy/isolated-labs/compose.yaml config --quiet
          docker compose -f deploy/isolated-labs/compose.yaml --profile audit --profile analysis config --format json > /tmp/lab-compose.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('deploy/isolated-labs/tool-status.json').read_text())
          tools=manifest['tools']
          assert len(tools)==11
          assert len({x['id'] for x in tools})==11
          assert all(x['status'] in ('not_provisioned','image_definition_only') for x in tools)
          assert manifest['liveDeployment'] is False
          assert manifest['railwayProduction']['installedCount']==8
          assert len(manifest['remainingSeven'])==7
          compose=json.loads(Path('/tmp/lab-compose.json').read_text())
          assert set(compose['services'])=={'kali-audit','ghidra-analysis'}
          for name,svc in compose['services'].items():
              assert not svc.get('ports'), name
              assert not svc.get('privileged'), name
              assert svc.get('network_mode')=='none', name
              assert svc.get('read_only') is True, name
              assert 'ALL' in svc.get('cap_drop',[]), name
              assert any('no-new-privileges:true' == x for x in svc.get('security_opt',[])), name
              assert svc.get('restart') in (None, 'no'), name
              assert not svc.get('devices'), name
          print('PASS: 11 truthful tool statuses, no ports, no network, no privileges')
          PY
          # Verify profiles that require a separate, private VM. Only dummy CI
          # credentials are interpolated; no service, VM or container starts.
          STAR_BH_PG_PASSWORD=ci-placeholder-unused-12345 \
          STAR_BH_NEO4J_PASSWORD=ci-placeholder-unused-67890 \
            docker compose -f deploy/isolated-labs/remaining-seven/compose.yaml \
              --profile bloodhound --profile caldera config --format json \
              > /tmp/star-seven-compose.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('/tmp/star-seven-compose.json').read_text())
          services=cfg['services']
          assert set(services)=={'bh-postgres','bh-neo4j','bloodhound','caldera-image-check'}
          for name,svc in services.items():
              assert not svc.get('privileged'),name
              assert not svc.get('devices'),name
              assert 'no-new-privileges:true' in svc.get('security_opt',[]),name
              assert 'bloodhound' in svc.get('profiles',[]) or 'caldera' in svc.get('profiles',[])
              assert 'docker.sock' not in str(svc.get('volumes',[]))
          for name in ['bh-postgres','bh-neo4j']:
              assert not services[name].get('ports'),name
          ports=services['bloodhound']['ports']
          assert len(ports)==1
          assert ports[0]['host_ip']=='127.0.0.1'
          assert int(ports[0]['published'])==18080
          assert cfg['networks']['bh-private']['internal'] is True
          assert cfg['networks']['bh-ui'].get('internal',False) is False
          assert set(services['bh-postgres']['networks'])=={'bh-private'}
          assert set(services['bh-neo4j']['networks'])=={'bh-private'}
          assert set(services['bloodhound']['networks'])=={'bh-private','bh-ui'}
          caldera=services['caldera-image-check']
          assert caldera['network_mode']=='none'
          assert not caldera.get('ports')
          assert caldera['read_only'] is True
          assert 'ALL' in caldera['cap_drop']
          assert 'IMAGE_VERIFIED_ONLY' in str(caldera['command'])
          raw=Path('deploy/isolated-labs/remaining-seven/compose.yaml').read_text()
          assert 'STAR_BH_PG_PASSWORD:?' in raw
          assert 'STAR_BH_NEO4J_PASSWORD:?' in raw
          print('PASS: 7-tool private lab has localhost-only UI, no public DB/C2 ports, and external secrets')
          PY

  kali-audit-image:
    needs: manifest-and-isolation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build signed Kali audit image (NetExec and Ligolo-ng)
        run: docker build --pull -t star-isolated-kali-audit:ci deploy/isolated-labs/kali-audit
      - name: Verify installed CLIs with networking completely disabled
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=128m \
            --tmpfs /workspace:rw,nosuid,nodev,uid=10001,gid=10001,mode=0700,size=128m \
            star-isolated-kali-audit:ci \
            /bin/bash -lc 'set -e; command -v nxc; command -v ligolo-proxy; dpkg-query -W netexec ligolo-ng; out="$(nxc --version 2>&1 || true)"; echo "$out"; grep -Eq "[0-9]+[.][0-9]+" <<< "$out"; ligolo-proxy -version'

  ghidra-image:
    # Expensive and already verified in its dedicated PR; opt-in only.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_ghidra }}
    needs: manifest-and-isolation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build optional large Ghidra headless image
        run: docker build --pull -t star-isolated-ghidra:ci deploy/isolated-labs/ghidra-analysis
      - name: Validate binary only; no sample or GUI launched
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            star-isolated-ghidra:ci \
            /bin/bash -lc 'test -x /usr/local/bin/star-ghidra-headless && echo GHIDRA_BINARY_VERIFIED'
