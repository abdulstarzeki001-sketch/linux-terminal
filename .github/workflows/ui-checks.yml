name: Railway Terminal UI Checks

on:
  pull_request:
    paths:
      - 'web/**'
      - 'server/**'
      - 'Dockerfile'
      - 'ai-gateway/**'
      - 'test/**'
      - '.github/workflows/ui-checks.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'server/**'
      - 'Dockerfile'
      - 'ai-gateway/**'
      - 'test/**'
      - '.github/workflows/ui-checks.yml'

permissions:
  contents: read

jobs:
  static-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check server and browser JS syntax
        run: |
          node --check web/app.js
          bash -n server/kali-shell.sh
          bash -n server/run-with-kali.sh
          python3 -m py_compile server/star-kali.py
          bash -n server/entrypoint.sh
          bash -n server/apt-track.sh
          bash -n server/restore-packages.sh
          bash -n server/persist-backup.sh
          bash -n server/restore-user-tools.sh
          bash -n test/persistence-redeploy.sh
          bash -n test/training-http.sh
          bash -n test/tool-ops-http.sh
          bash -n test/certipy-image-smoke.sh
          bash -n test/approved-linux-tools-smoke.sh
          bash -n test/netexec-image-smoke.sh
          bash -n test/ligolo-image-smoke.sh
          bash -n test/syzkaller-image-smoke.sh
          bash -n server/ghidra-headless.sh
          bash -n test/ghidra-image-smoke.sh
          node --check server/tool-ops.js
          bash -n server/apt-wrapper.sh
          bash -n server/persist-cli.sh
          node --check server/index.js
          node --check server/ai.js
          node --check server/boot-audit.js
          node --check ai-gateway/index.js
          node --check ai-gateway/provider.js
      - name: Check return navigation and existing login
        run: node --test test/*.test.js
      - name: Verify self-hosted GPU Compose configuration (no GPU required)
        run: |
          docker compose -f deploy/selfhosted-gpu/compose.yml \
            --env-file deploy/selfhosted-gpu/.env.example config --quiet
          test -z "$(docker compose -f deploy/selfhosted-gpu/compose.yml \
            --env-file deploy/selfhosted-gpu/.env.example config --format json | \
            python3 -c 'import json,sys; d=json.load(sys.stdin); print("host port published" if d["services"]["inference"].get("ports") else "",end="")')"
      - name: Build isolated AI gateway Docker image
        run: docker build -f ai-gateway/Dockerfile -t star-ai-gateway:ci .
      - name: Verify AI gateway uses Node.js 24
        run: docker run --rm --entrypoint node star-ai-gateway:ci -e 'if(process.versions.node.split(".")[0]!=="24")process.exit(1);console.log(process.version)'

  kali-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned KALI OSINT STAR Railway terminal image
        run: docker build --pull -t star-kali-terminal:ci .
      - name: Verify terminal uses Node.js 24
        run: docker run --rm --entrypoint node star-kali-terminal:ci -e 'if(process.versions.node.split(".")[0]!=="24")process.exit(1);console.log(process.version)'
      - name: Verify isolated Python 3.12 and unchanged Python 3.11
        run: |
          docker run --rm --entrypoint /bin/bash star-kali-terminal:ci -lc '
            set -euo pipefail
            /usr/local/bin/python3.12 -c "import sys,ssl,sqlite3,venv,ensurepip; assert sys.version_info[:2] == (3,12)"
            /usr/bin/python3 -c "import sys; assert sys.version_info[:2] == (3,11)"
            /usr/local/bin/python3.12 -m ensurepip --version
            echo "Both isolated Python 3.12 and system Python 3.11 verified"
          '
      - name: Verify approved Certipy AD 5.1.0 package, CLI and catalog
        run: docker run --rm -v "$PWD/test:/tmp/star-tests:ro" --entrypoint /bin/bash star-kali-terminal:ci /tmp/star-tests/certipy-image-smoke.sh
      - name: Verify Impacket, Frida, AFL++ package, local CLIs and live inventory
        run: docker run --rm -v "$PWD/test:/tmp/star-tests:ro" --entrypoint /bin/bash star-kali-terminal:ci /tmp/star-tests/approved-linux-tools-smoke.sh
      - name: Verify NetExec 1.5.1 local CLI and live inventory (no target traffic)
        run: docker run --rm -v "$PWD/test:/tmp/star-tests:ro" --entrypoint /bin/bash star-kali-terminal:ci /tmp/star-tests/netexec-image-smoke.sh
      - name: Verify Ligolo-ng 0.9.2 local CLI (no tunnel or network listeners)
        run: docker run --rm -v "$PWD/test:/tmp/star-tests:ro" --network none --entrypoint /bin/bash star-kali-terminal:ci /tmp/star-tests/ligolo-image-smoke.sh
      - name: Verify pinned syz-manager binary and safe local usage (no QEMU or fuzzing)
        run: docker run --rm -v "$PWD/test:/tmp/star-tests:ro" --network none --entrypoint /bin/bash star-kali-terminal:ci /tmp/star-tests/syzkaller-image-smoke.sh
      - name: Verify Ghidra 12.0.4 offline headless usage, Java 21 and inventory
        run: docker run --rm -v "$PWD/test:/tmp/star-tests:ro" --network none --entrypoint /bin/bash star-kali-terminal:ci /tmp/star-tests/ghidra-image-smoke.sh
      - name: Exercise authenticated real HTTP grading and persistence
        run: docker run --rm -v "$PWD/test:/tmp/star-tests:ro" --entrypoint /bin/bash star-kali-terminal:ci /tmp/star-tests/training-http.sh
      - name: Real HTTP owner tools catalog, AI dispatch and persistent results
        run: docker run --rm -v "$PWD/test:/tmp/star-tests:ro" --entrypoint /bin/bash star-kali-terminal:ci /tmp/star-tests/tool-ops-http.sh
      - name: Verify bundled Python API and loopback client
        run: |
          docker run --rm --entrypoint /bin/bash star-kali-terminal:ci -lc 'PYTHONPATH=/opt/kali-osint-star/services/api /opt/star-kali-venv/bin/python -c "from app.main import app; print(app.version)"'
          docker run --rm --entrypoint /usr/local/bin/star-kali star-kali-terminal:ci --help
      - name: Verify tools without probing any external hosts
        run: |
          docker run --rm --entrypoint /bin/bash star-kali-terminal:ci -lc '
            set -euo pipefail
            for tool in nmap tcpdump tshark whois dig traceroute; do
              command -v "$tool" >/dev/null
              echo "OK: $tool present"
            done
            nmap --version
            tcpdump --version
            tshark --version
          '
      - name: Prove persisted files and APT packages survive container replacement
        run: bash test/persistence-redeploy.sh star-kali-terminal:ci
