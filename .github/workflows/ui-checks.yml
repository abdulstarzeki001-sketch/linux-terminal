name: Railway Terminal UI Checks

on:
  pull_request:
    paths:
      - 'web/**'
      - 'server/**'
      - 'Dockerfile'
      - 'ai-gateway/**'
      - 'test/**'
      - '.github/workflows/ui-checks.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'server/**'
      - 'Dockerfile'
      - 'ai-gateway/**'
      - 'test/**'
      - '.github/workflows/ui-checks.yml'

permissions:
  contents: read

jobs:
  static-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check server and browser JS syntax
        run: |
          node --check web/app.js
          bash -n server/kali-shell.sh
          bash -n server/run-with-kali.sh
          python3 -m py_compile server/star-kali.py
          bash -n server/entrypoint.sh
          bash -n server/apt-track.sh
          bash -n server/restore-packages.sh
          bash -n server/persist-backup.sh
          bash -n server/restore-user-tools.sh
          bash -n test/persistence-redeploy.sh
          bash -n test/training-http.sh
          bash -n server/apt-wrapper.sh
          bash -n server/persist-cli.sh
          node --check server/index.js
          node --check server/ai.js
          node --check server/boot-audit.js
          node --check ai-gateway/index.js
          node --check ai-gateway/provider.js
      - name: Check return navigation and existing login
        run: node --test test/*.test.js
      - name: Build isolated AI gateway Docker image
        run: docker build -f ai-gateway/Dockerfile -t star-ai-gateway:ci .
      - name: Verify AI gateway uses Node.js 24
        run: docker run --rm --entrypoint node star-ai-gateway:ci -e 'if(process.versions.node.split(".")[0]!=="24")process.exit(1);console.log(process.version)'

  kali-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned KALI OSINT STAR Railway terminal image
        run: docker build --pull -t star-kali-terminal:ci .
      - name: Verify terminal uses Node.js 24
        run: docker run --rm --entrypoint node star-kali-terminal:ci -e 'if(process.versions.node.split(".")[0]!=="24")process.exit(1);console.log(process.version)'
      - name: Exercise authenticated real HTTP grading and persistence
        run: docker run --rm -v "$PWD/test:/tmp/star-tests:ro" --entrypoint /bin/bash star-kali-terminal:ci /tmp/star-tests/training-http.sh
      - name: Verify bundled Python API and loopback client
        run: |
          docker run --rm --entrypoint /bin/bash star-kali-terminal:ci -lc 'PYTHONPATH=/opt/kali-osint-star/services/api /opt/star-kali-venv/bin/python -c "from app.main import app; print(app.version)"'
          docker run --rm --entrypoint /usr/local/bin/star-kali star-kali-terminal:ci --help
      - name: Verify tools without probing any external hosts
        run: |
          docker run --rm --entrypoint /bin/bash star-kali-terminal:ci -lc '
            set -euo pipefail
            for tool in nmap tcpdump tshark whois dig traceroute; do
              command -v "$tool" >/dev/null
              echo "OK: $tool present"
            done
            nmap --version
            tcpdump --version
            tshark --version
          '
      - name: Prove persisted files and APT packages survive container replacement
        run: bash test/persistence-redeploy.sh star-kali-terminal:ci
