name: STAR AI Gateway CI
on:
  pull_request:
    paths:
      - 'ai-gateway/**'
      - 'test/minis*.test.js'
      - '.github/workflows/star-ai-gateway-ci.yml'
  push:
    branches:
      - 'feature/star-minis-compatible-api'
    paths:
      - 'ai-gateway/**'
      - 'test/minis*.test.js'
      - '.github/workflows/star-ai-gateway-ci.yml'
permissions:
  contents: read
jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax checks
        run: |
          for f in ai-gateway/*.js; do node --check "$f"; done
      - name: Authenticated Minis and MCP tests
        run: node --test test/minis-api.test.js test/minis-tools.test.js
