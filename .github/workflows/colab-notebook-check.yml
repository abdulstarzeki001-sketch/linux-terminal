name: Validate STAR AI Colab GPU Notebooks

on:
  push:
    branches: [main]
    paths:
      - 'colab/STAR_AI_Qwen35_GPU_Colab.ipynb'
      - 'colab/STAR_AI_ULTRA_A100_80GB.ipynb'
      - 'colab/STAR_AI_ULTRA_GPU_Colab.ipynb'
      - '.github/workflows/colab-notebook-check.yml'
  pull_request:
    paths:
      - 'colab/STAR_AI_Qwen35_GPU_Colab.ipynb'
      - 'colab/STAR_AI_ULTRA_A100_80GB.ipynb'
      - 'colab/STAR_AI_ULTRA_GPU_Colab.ipynb'
      - '.github/workflows/colab-notebook-check.yml'

permissions:
  contents: read

jobs:
  syntax-and-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check notebook JSON, Python syntax and networking safety (no GPU used)
        shell: bash
        run: |
          python3 - <<'PY'
          import ast, json
          from pathlib import Path

          paths = [
              Path("colab/STAR_AI_Qwen35_GPU_Colab.ipynb"),
              Path("colab/STAR_AI_ULTRA_A100_80GB.ipynb"),
              Path("colab/STAR_AI_ULTRA_GPU_Colab.ipynb"),
          ]
          for path in paths:
              nb = json.loads(path.read_text(encoding="utf-8"))
              assert nb.get("nbformat") == 4
              assert nb.get("metadata", {}).get("kernelspec", {}).get("name") == "python3"
              cells = nb.get("cells", [])
              assert sum(c["cell_type"] == "code" for c in cells) >= 5
              code = ""
              for i, cell in enumerate(cells):
                  if cell["cell_type"] != "code":
                      continue
                  assert cell.get("execution_count") is None, f"{path}: executed cell {i}"
                  assert not cell.get("outputs"), f"{path}: outputs in cell {i}"
                  src = "".join(cell.get("source", []))
                  ast.parse(src, filename=f"{path}:cell-{i}")
                  code += src + "\n"
              assert "127.0.0.1:11434" in code
              assert "OLLAMA_HOST" in code
              assert "nvidia-smi" in code
              for forbidden in ("ngrok", "cloudflared", "localtunnel", "0.0.0.0:11434"):
                  assert forbidden not in code, f"{path}: external tunnel/bind {forbidden}"
              print(f"PASS: {path}: {len(cells)} cells (syntax only; live GPU not checked)")
          PY

      - name: Verify resource routing without a GPU
        shell: bash
        run: |
          python3 - <<'PY'
          import ast, json
          from pathlib import Path
          notebook = json.loads(Path('colab/STAR_AI_ULTRA_GPU_Colab.ipynb').read_text())
          source = next(
              ''.join(cell['source']) for cell in notebook['cells']
              if 'MODEL_CHOICES = ' in ''.join(cell.get('source', []))
          )
          for vram, disk, expected in [
              (79.3, 110, 'qwen3.6:35b'),
              (30, 30, 'qwen3.6:27b'),
              (16, 20, 'qwen3.5:9b'),
              (9, 9, 'qwen3.5:4b'),
          ]:
              env = {'gpu_free_gib': vram, 'disk_free_gib': disk}
              exec(compile(source, '<selection>', 'exec'), env)
              assert env['MODEL'] == expected, (vram, disk, env['MODEL'], expected)
          print('PASS: 4 resource-selection cases')
          PY
